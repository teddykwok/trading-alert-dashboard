<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chart Render Target</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0e11;
      }

      #chart-wrapper {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0b0e11;
      }

      #chart-container {
        width: 100%;
        height: 100%;
      }

      #chart-label {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e6e8ea;
        background: rgba(17, 20, 24, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 10px 14px;
        line-height: 1.4;
      }

      #chart-label .symbol {
        font-size: 16px;
        font-weight: 700;
      }

      #chart-label .meta {
        font-size: 12px;
        color: #9aa4af;
      }

      #chart-label .signal {
        display: inline-block;
        margin-top: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .signal-long {
        background: rgba(34, 197, 94, 0.18);
        color: #4ade80;
      }

      .signal-short {
        background: rgba(239, 68, 68, 0.18);
        color: #f87171;
      }

      .signal-watch {
        background: rgba(234, 179, 8, 0.18);
        color: #facc15;
      }

      .signal-exit {
        background: rgba(148, 163, 184, 0.18);
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div id="chart-wrapper">
      <div id="chart-container"></div>
      <div id="chart-label"></div>
    </div>

    <script>
      // Populated by chart-renderer.service.ts via page.evaluate after the
      // lightweight-charts UMD bundle has been injected with addScriptTag.
      // `priceFormat` ({ precision, minMove }) is precomputed in Node from the
      // alert price's magnitude so small-cap prices don't render as "0.00".
      window.renderChart = function renderChart({ candles, priceLine, priceFormat, label }) {
        const container = document.getElementById("chart-container");

        const chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight,
          layout: {
            background: { color: "#0b0e11" },
            textColor: "#9aa4af",
          },
          grid: {
            vertLines: { color: "rgba(255,255,255,0.04)" },
            horzLines: { color: "rgba(255,255,255,0.04)" },
          },
          timeScale: {
            borderColor: "rgba(255,255,255,0.08)",
            timeVisible: true,
          },
          rightPriceScale: {
            borderColor: "rgba(255,255,255,0.08)",
          },
        });

        const candleSeries = chart.addCandlestickSeries({
          upColor: "#22c55e",
          downColor: "#ef4444",
          borderVisible: false,
          wickUpColor: "#22c55e",
          wickDownColor: "#ef4444",
          // Governs the y-axis labels AND the alert price line's axis label.
          priceFormat: {
            type: "price",
            precision: priceFormat.precision,
            minMove: priceFormat.minMove,
          },
        });

        candleSeries.setData(candles);

        candleSeries.createPriceLine({
          price: priceLine.price,
          color: "#f5b700",
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: "alert",
        });

        chart.timeScale().fitContent();

        const labelEl = document.getElementById("chart-label");
        const signalClass = "signal-" + label.signal.toLowerCase();
        labelEl.innerHTML =
          '<div class="symbol">' +
          label.symbol +
          '</div><div class="meta">' +
          label.timeframe +
          " &middot; " +
          label.price +
          '</div><span class="signal ' +
          signalClass +
          '">' +
          label.signal +
          "</span>";

        window.__CHART_READY__ = true;
      };
    </script>
  </body>
</html>
